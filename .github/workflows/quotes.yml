name: Fetch quotes

on:
  push:
    paths:
      - 'tickers.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch quotes from Alpaca
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python fetch_quotes.py
      - name: Commit quotes.json
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet || git commit -m "quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
